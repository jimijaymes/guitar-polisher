name: Build Guitar Polisher Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $plugins = Get-ChildItem build -Recurse -Filter *.vst3 | Where-Object { $_.PSIsContainer }
          if (-not $plugins) { throw "No VST3 bundle found" }
          foreach ($plugin in $plugins) { Copy-Item $plugin.FullName -Destination dist -Recurse -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: GuitarPolisher-Windows-x64-VST3
          path: dist/
          if-no-files-found: error
